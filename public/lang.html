<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fedi Ghanmi (Torbaga) — Cours particuliers d'informatique</title>
    <style>
        :root{--bg:#0b0b0c;--ink:#f4f0e8;--gold:#d8b56a;--muted:#a6a19a;--line:#302e2a}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(216,181,106,.14),transparent 38rem),var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:24px}
        .card{width:min(560px,100%);text-align:center;border:1px solid var(--line);padding:52px 34px;background:#111112;box-shadow:0 30px 100px rgba(0,0,0,.45)}
        .eyebrow{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
        .logo{font-family:Georgia,serif;font-size:46px;margin:18px 0 8px}
        .sub{color:var(--ink);font-size:16px;margin:0 0 12px}
        .description{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto 34px;max-width:410px}
        .choice{color:#77736c;font-size:11px;letter-spacing:.08em;margin-bottom:12px}
        .langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .lang{display:block;padding:15px 10px;border:1px solid rgba(216,181,106,.4);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:800;letter-spacing:.08em;transition:.2s}
        .lang:hover{background:var(--gold);color:#111;border-color:var(--gold)}
        small{display:block;color:#6f6b65;margin-top:28px;font-size:10px;letter-spacing:.08em;line-height:1.6}
    </style>
</head>
<body>
<main class="card">
    <div class="eyebrow">Fedi Ghanmi (Torbaga) · Bac Informatique 2027</div>
    <div class="logo">Cours particuliers</div>
    <p class="sub">Informatique · En privé</p>
    <p class="description">
        Un accompagnement individuel adapté à ton niveau, chez moi ou directement chez toi.
    </p>
    <div class="choice">Choisis ta langue / Choose your language / اختر لغتك</div>
    <div class="langs">
        <a class="lang" href="/?lang=fr">FR</a>
        <a class="lang" href="/?lang=en">EN</a>
        <a class="lang" href="/?lang=ar">AR</a>
    </div>
    <small>Cours particuliers · Chez moi · Chez toi · Sur rendez-vous</small>
</main>
</body>
</html>
