<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bac Informatique 2027 — Choisir la langue</title>
<style>
:root{--bg:#0b0b0c;--ink:#f4f0e8;--gold:#d8b56a;--muted:#a6a19a;--line:#302e2a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(216,181,106,.14),transparent 38rem),#0b0b0c;color:var(--ink);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);text-align:center;border:1px solid var(--line);padding:48px 32px;background:#111112;box-shadow:0 30px 100px rgba(0,0,0,.45)}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.logo{font-family:Georgia,serif;font-size:42px;margin:18px 0 10px}.sub{color:var(--muted);margin:0 0 32px}.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lang{display:block;padding:15px 10px;border:1px solid rgba(216,181,106,.4);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:800;letter-spacing:.08em;transition:.2s}.lang:hover{background:var(--gold);color:#111;border-color:var(--gold)}small{display:block;color:#6f6b65;margin-top:28px;font-size:11px}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">Bac Informatique 2027</div>
<div class="logo">Fedi Ghanmi</div>
<p class="sub">Choisis ta langue / Choose your language / اختر لغتك</p>
<div class="langs">
<a class="lang" href="/?lang=fr">FR</a>
<a class="lang" href="/?lang=en">EN</a>
<a class="lang" href="/?lang=ar">AR</a>
</div>
<small>Préparation • Séances d'étude • Bac Informatique</small>
</main>
</body>
</html>
