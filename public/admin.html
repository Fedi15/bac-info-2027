<!doctype html>
<html lang="ar-TN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private Tutoring — Leads</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b0b0c;color:#eee;margin:0;padding:30px}
    .wrap{max-width:1200px;margin:auto}
    .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .language{margin-left:auto;display:flex;gap:6px}
    input,button,select{padding:11px 13px;border:1px solid #444;background:#151516;color:#eee;border-radius:7px}
    button{cursor:pointer;border-color:#c7a66a}
    .language button{border-color:#444}
    .language button.active{border-color:#c7a66a;color:#c7a66a}

    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}
    .stat{border:1px solid #333;background:#111214;border-radius:10px;padding:18px}
    .stat-label{font-size:12px;color:#aaa;margin-bottom:8px}
    .stat-value{font-size:30px;font-weight:700;color:#c7a66a;line-height:1.1}
    @media (max-width:700px){.stats{grid-template-columns:1fr}}
    .status{margin:16px 0;color:#aaa}
    .table-wrap{overflow:auto;border:1px solid #333}
    table{border-collapse:collapse;width:100%;min-width:1000px}
    th,td{padding:10px;border-bottom:1px solid #29292a;text-align:left;font-size:13px;vertical-align:top}
    th{color:#c7a66a}
    html[dir="rtl"] body{text-align:right}
    html[dir="rtl"] .top{flex-direction:row-reverse}
    html[dir="rtl"] .language{margin-left:0;margin-right:auto}
    html[dir="rtl"] th,html[dir="rtl"] td{text-align:right}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="pageTitle">Student requests</h1>
  </div>

  <div class="top">
    <input id="token" type="password" placeholder="ADMIN_TOKEN">
    <button id="load" type="button">Load requests</button>
  </div>


  <div class="stats">
    <div class="stat"><div class="stat-label" id="sVisitorsLabel">Unique visitors</div><div class="stat-value" id="visitorCount">—</div></div>
    <div class="stat"><div class="stat-label" id="sTodayLabel">Today’s visitors</div><div class="stat-value" id="todayVisitorCount">—</div></div>
    <div class="stat"><div class="stat-label" id="sRequestsLabel">Student requests</div><div class="stat-value" id="requestCount">—</div></div>
  </div>

  <div id="status" class="status"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th id="hDate">Date</th>
          <th id="hName">Name</th>
          <th id="hPhone">Phone</th>
          <th id="hEmail">Email</th>
          <th id="hLevel">Level / section</th>
          <th id="hSchool">School</th>
          <th id="hCity">City</th>
          <th id="hLocation">Location</th>
          <th id="hSource">Source</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const token = document.getElementById("token");
const load = document.getElementById("load");
const status = document.getElementById("status");
const rows = document.getElementById("rows");
const visitorCount = document.getElementById("visitorCount");
const todayVisitorCount = document.getElementById("todayVisitorCount");
const requestCount = document.getElementById("requestCount");

const translations = {
  tn: {
    dir: "rtl",
    title: "طلبات التلامذة",
    load: "حمّل الطلبات",
    loading: "جاري التحميل…",
    date: "التاريخ",
    name: "الإسم",
    phone: "التليفون",
    email: "الإيميل",
    level: "المستوى / الشعبة",
    school: "الليسي / المؤسسة",
    city: "المدينة",
    location: "بلاصة الـséance",
    source: "المصدر",
    requests: n => `${n} طلب`,
    unable: "ما نجّمش نحمّلو الطلبات.",
    requestFailed: "الطلب فشل",
    visitors: "الزوار المختلفين",
    todayVisitors: "زوار اليوم",
    studentRequests: "طلبات التلامذة"
  }
};

const esc = value => String(value ?? "").replace(/[&<>'"]/g, c => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  "'":"&#39;",
  '"':"&quot;"
}[c]));

let currentLang = "tn";

function applyLanguage() {
  currentLang = "tn";
  const t = translations.tn;
  document.documentElement.lang = "ar-TN";
  document.documentElement.dir = t.dir;

  document.getElementById("pageTitle").textContent = t.title;
  load.textContent = t.load;
  document.getElementById("hDate").textContent = t.date;
  document.getElementById("hName").textContent = t.name;
  document.getElementById("hPhone").textContent = t.phone;
  document.getElementById("hEmail").textContent = t.email;
  document.getElementById("hLevel").textContent = t.level;
  document.getElementById("hSchool").textContent = t.school;
  document.getElementById("hCity").textContent = t.city;
  document.getElementById("hLocation").textContent = t.location;
  document.getElementById("hSource").textContent = t.source;
  document.getElementById("sVisitorsLabel").textContent = t.visitors;
  document.getElementById("sTodayLabel").textContent = t.todayVisitors;
  document.getElementById("sRequestsLabel").textContent = t.studentRequests;
}

load.addEventListener("click", async () => {
  const t = translations.tn;

  status.textContent = t.loading;
  rows.innerHTML = "";
  visitorCount.textContent = "—";
  todayVisitorCount.textContent = "—";
  requestCount.textContent = "—";

  try {
    const headers = {
      Authorization: `Bearer ${token.value}`
    };

    const [leadsResponse, statsResponse] = await Promise.all([
      fetch("/api/leads", { headers }),
      fetch("/api/stats", { headers })
    ]);

    const leadsData = await leadsResponse.json();
    const statsData = await statsResponse.json();

    if (!leadsResponse.ok) {
      throw new Error(leadsData.error || t.requestFailed);
    }

    if (!statsResponse.ok) {
      throw new Error(statsData.error || t.requestFailed);
    }

    rows.innerHTML = leadsData.leads.map(x => `
      <tr>
        <td>${esc(x.created_at)}</td>
        <td>${esc(x.full_name)}</td>
        <td>${esc(x.phone)}</td>
        <td>${esc(x.email)}</td>
        <td>${esc(x.level)}</td>
        <td>${esc(x.school)}</td>
        <td>${esc(x.city)}</td>
        <td>${esc(x.lesson_location)}</td>
        <td>${esc(x.source)}</td>
      </tr>
    `).join("");

    visitorCount.textContent = Number(statsData.unique_visitors || 0).toLocaleString();
    todayVisitorCount.textContent = Number(statsData.today_visitors || 0).toLocaleString();
    requestCount.textContent = Number(leadsData.leads.length || 0).toLocaleString();
    status.textContent = t.requests(leadsData.leads.length);
  } catch (e) {
    status.textContent = e.message || t.unable;
  }
});

applyLanguage(currentLang);
</script>
</body>
</html>
