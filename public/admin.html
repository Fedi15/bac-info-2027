<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private Tutoring — Leads</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b0b0c;color:#eee;margin:0;padding:30px}
    .wrap{max-width:1200px;margin:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input,button{padding:11px 13px;border:1px solid #444;background:#151516;color:#eee;border-radius:7px}
    button{cursor:pointer;border-color:#c7a66a}.status{margin:16px 0;color:#aaa}.table-wrap{overflow:auto;border:1px solid #333}
    table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #29292a;text-align:left;font-size:13px;vertical-align:top}th{color:#c7a66a}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Student requests</h1>
  <div class="top">
    <input id="token" type="password" placeholder="ADMIN_TOKEN">
    <button id="load" type="button">Load requests</button>
  </div>
  <div id="status" class="status"></div>
  <div class="table-wrap"><table><thead><tr>
    <th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Level / section</th><th>School</th><th>City</th><th>Location</th><th>Availability</th><th>Source</th>
  </tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const token=document.getElementById("token"),load=document.getElementById("load"),status=document.getElementById("status"),rows=document.getElementById("rows");
const esc=value=>String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
load.addEventListener("click",async()=>{
  status.textContent="Loading…"; rows.innerHTML="";
  try{
    const r=await fetch("/api/leads",{headers:{Authorization:`Bearer ${token.value}`}});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Request failed");
    rows.innerHTML=data.leads.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.full_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.level)}</td><td>${esc(x.school)}</td><td>${esc(x.city)}</td><td>${esc(x.lesson_location)}</td><td>${esc(x.availability)}</td><td>${esc(x.source)}</td></tr>`).join("");
    status.textContent=`${data.leads.length} request(s)`;
  }catch(e){status.textContent=e.message||"Unable to load requests.";}
});
</script>
</body>
</html>
